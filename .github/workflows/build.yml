name: Build & Release Artifacts

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Run unit tests
        run: cargo test --lib --verbose

      - name: Build Windows release binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: doa6-trainer-windows-x64
          path: target/x86_64-pc-windows-gnu/release/doa6-trainer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-gnu/release/doa6-trainer.exe
          body_path: CHANGELOG.md
