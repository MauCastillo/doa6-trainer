[package]
name = "doa6-trainer"
version = "0.1.0"
edition = "2024"
description = "Trainer para Dead or Alive 6 (v1.0-v1.20) con interfaz gráfica"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
lto = true
strip = true
